# Configuración del scanner SonarQube (SonarQube Cloud o self-hosted).
# El host, el token y la organización (solo Cloud) llegan por entorno o -D
# (SONAR_HOST_URL / SONAR_TOKEN / SONAR_ORGANIZATION), nunca por este archivo.
# En CI, SONAR_PROJECT_KEY reemplaza el projectKey de abajo (en Cloud suele ser <organizacion>_pms-hotel-boutique).
# Ver docs/ci-cd.md.
sonar.projectKey=pms-hotel-boutique
sonar.projectName=PMS Hotel Boutique Frontend
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests,scripts
sonar.test.inclusions=tests/**,scripts/test-*.mjs
sonar.exclusions=dist/**,node_modules/**,.cache/**,coverage/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
