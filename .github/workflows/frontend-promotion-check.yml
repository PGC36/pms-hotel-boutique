name: Frontend promotion check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  docker-check:
    name: Imagen Docker sin source maps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (sin push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: pms-hotel-boutique:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha

      - name: La imagen no contiene source maps
        run: sh docker/check-no-sourcemaps.sh "pms-hotel-boutique:pr-${{ github.event.pull_request.number }}"
