name: CI/CD

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Validate and test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }} # solo SonarQube Cloud

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static checks
        id: check
        run: npm run check

      - name: Run tests and coverage
        id: test
        run: npm run test:coverage

      - name: Verificar disponibilidad de SonarQube
        id: sonar-check
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "::notice title=SonarQube omitido::SONAR_TOKEN o SONAR_HOST_URL no están configurados. El análisis no se ejecutó; no equivale a un Quality Gate aprobado."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=SONAR_TOKEN o SONAR_HOST_URL no configurados" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if curl -fsS --max-time 20 "${SONAR_HOST_URL%/}/api/system/status" | grep -q '"status":"UP"'; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=SonarQube omitido::${SONAR_HOST_URL} no responde UP desde el runner. El análisis no se ejecutó; no equivale a un Quality Gate aprobado."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=el servidor no responde UP desde el runner" >> "$GITHUB_OUTPUT"
          fi

      - name: Análisis SonarQube + Quality Gate
        id: sonar
        if: steps.sonar-check.outputs.enabled == 'true'
        run: |
          npm run sonar -- \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            ${SONAR_PROJECT_KEY:+-Dsonar.projectKey="$SONAR_PROJECT_KEY"} \
            ${SONAR_ORGANIZATION:+-Dsonar.organization="$SONAR_ORGANIZATION"} \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

      - name: Resumen
        if: always()
        env:
          CHECK: ${{ steps.check.outcome }}
          TEST: ${{ steps.test.outcome }}
          SONAR_ENABLED: ${{ steps.sonar-check.outputs.enabled }}
          SONAR_REASON: ${{ steps.sonar-check.outputs.reason }}
          SONAR: ${{ steps.sonar.outcome }}
        run: |
          icon() {
            case "$1" in
              success) echo "✅ OK" ;;
              failure) echo "❌ Falló" ;;
              *) echo "⏭️ No se ejecutó (falló un paso previo)" ;;
            esac
          }
          if [ "$SONAR_ENABLED" = "true" ]; then
            case "$SONAR" in
              success) sonar_result="✅ Quality Gate aprobado" ;;
              failure) sonar_result="❌ Quality Gate rechazado o error de análisis (ver log y SonarQube)" ;;
              *) sonar_result="⏭️ No se ejecutó (falló un paso previo)" ;;
            esac
          elif [ -n "$SONAR_REASON" ]; then
            sonar_result="⚠️ OMITIDO — ${SONAR_REASON}. No es un Quality Gate aprobado."
          else
            sonar_result="⏭️ No se ejecutó (falló un paso previo)"
          fi
          {
            echo "## Frontend CI"
            echo ""
            echo "| Etapa | Resultado |"
            echo "| --- | --- |"
            echo "| Validaciones (formato, tipos, lint, build, pruebas) | $(icon "$CHECK") |"
            echo "| Pruebas + cobertura | $(icon "$TEST") |"
            echo "| SonarQube | ${sonar_result} |"
          } >> "$GITHUB_STEP_SUMMARY"

  production-build-and-release:
    name: Production build and release
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master' ||
      startsWith(github.ref, 'refs/tags/v'))
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build
        env:
          NODE_ENV: production

      - name: Archive production build
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/

  docker-check:
    name: Imagen Docker sin source maps
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (sin push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: pms-hotel-boutique:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha

      - name: La imagen no contiene source maps
        run: sh docker/check-no-sourcemaps.sh "pms-hotel-boutique:pr-${{ github.event.pull_request.number }}"

  docker:
    name: Imagen Docker en GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Nombre de imagen
        id: meta
        run: |
          # GHCR exige nombres en minúsculas.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Sentry (docs/sentry.md): sin estos secrets la imagen se construye igual, sin
      # Sentry ni source maps. El token va como secret de BuildKit, no como build-arg.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            VITE_SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=production
            VITE_SENTRY_RELEASE=${{ github.sha }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: La imagen no contiene source maps
        run: sh docker/check-no-sourcemaps.sh "${{ steps.meta.outputs.image }}:${{ github.sha }}"

      - name: Push
        run: |
          docker push "${{ steps.meta.outputs.image }}:${{ github.sha }}"
          docker push "${{ steps.meta.outputs.image }}:latest"

  deploy:
    name: Deploy al VPS
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Verificar secrets de deploy
        id: check
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "::notice title=Deploy omitido::Faltan DEPLOY_HOST, DEPLOY_KEY o DEPLOY_KNOWN_HOSTS."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy por SSH
        if: steps.check.outputs.enabled == 'true'
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          # La llave solo puede ejecutar /opt/pms/deploy.sh en el servidor (forced command).
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "deploy@${DEPLOY_HOST}" "frontend ${GITHUB_SHA}"
