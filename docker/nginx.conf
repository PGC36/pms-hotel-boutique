# Nginx del contenedor "frontend": sirve la SPA y redirige /api al backend.
# Este archivo vive en el contexto http (conf.d), por eso las zonas van aquí arriba.

# --- Límite de peticiones por IP ---
# Con Cloudflare delante, $binary_remote_addr sería la IP de Cloudflare: antes de
# activarlo hay que agregar set_real_ip_from + real_ip_header CF-Connecting-IP.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
limit_req_status 429;

server_tokens off;

server {
    listen 80;
    server_name _;

    # HTTPS de producción (opcional). En local esta carpeta está vacía y el include no
    # agrega nada. En el VPS se monta /opt/pms/nginx-tls con cloudflare.conf: listen 443,
    # certificado de origen de Cloudflare, IP real del visitante y redirección a HTTPS.
    include /etc/nginx/tls/*.conf;

    root /usr/share/nginx/html;
    index index.html;

    # El backend acepta hasta 11 MB por las imágenes de catálogo.
    client_max_body_size 11m;

    # --- Cabeceras de seguridad ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # La CSP se agrega después de probar la app completa, para no romper estilos ni imágenes.

    # Resolver de Docker: evita que Nginx falle al arrancar si el backend aún no existe.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Login de personal y de huésped, registro y vinculación por código de reserva:
    # los blancos obvios de fuerza bruta. /auth/refresh y /auth/permissions quedan fuera:
    # el frontend los llama en cada carga y el personal comparte la IP del hotel.
    location ~ ^/api/v1/(auth/login|guest/auth/(login|register|link))$ {
        limit_req zone=api_auth burst=5 nodelay;
        proxy_pass $backend_upstream;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass $backend_upstream;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # Archivos con hash en el nombre: se pueden cachear mucho tiempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA con createBrowserRouter: cualquier ruta que no sea un archivo devuelve index.html.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
